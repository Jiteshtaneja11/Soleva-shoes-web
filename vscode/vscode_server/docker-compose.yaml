services:
  # Development services
  postgres:
    image: ghcr.io/serverpod/postgres:16
    ports:
      - "8090:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: vscode
      POSTGRES_PASSWORD: "ofUVpOsFQqAbI9gWP-RRgCqf0pfn_LSZ"
    volumes:
      - vscode_data:/var/lib/postgresql/data

  redis:
    image: redis:6.2.6
    ports:
      - "8091:6379"
    command: redis-server --requirepass "JNNjQcNf-AXRX4QwMM9ixE7LWF065juz"
    environment:
      - REDIS_REPLICATION_MODE=master

  # Test services
  postgres_test:
    image: ghcr.io/serverpod/postgres:16
    ports:
      - "9090:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: vscode_test
      POSTGRES_PASSWORD: "oh_jIzmPNk1OMha8d3SBi7vhXK8FbSs8"
    volumes:
      - vscode_test_data:/var/lib/postgresql/data

  redis_test:
    image: redis:6.2.6
    ports:
      - "9091:6379"
    command: redis-server --requirepass "uRyIUsCYjJhJAuFGrg_xHuxhcNXINM_4"
    environment:
      - REDIS_REPLICATION_MODE=master

volumes:
  vscode_data:
  vscode_test_data:
